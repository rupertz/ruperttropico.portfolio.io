<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Stranger Things 3D Photo Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-container">
    <div class="bg-layer visible" id="bg1"></div>
    <div class="bg-layer" id="bg2"></div>
  </div>

  <div class="scene">
    <div class="carousel">
      <div class="card" data-index="0"><img src="src/images/mike.png" alt=""></div>
      <div class="card" data-index="1"><img src="src/images/jane.png" alt=""></div>
      <div class="card" data-index="2"><img src="src/images/will.png" alt=""></div>
      <div class="card" data-index="3"><img src="src/images/dustin.png" alt=""></div>
      <div class="card" data-index="4"><img src="src/images/max.png" alt=""></div>
      <div class="card" data-index="5"><img src="src/images/lucas.png" alt=""></div>
      <div class="card" data-index="6"><img src="src/images/steve.png" alt=""></div>
      <div class="card" data-index="7"><img src="src/images/nancy.png" alt=""></div>
      <div class="card" data-index="8"><img src="src/images/jonathan.png" alt=""></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
